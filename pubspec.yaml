name: groove
description: "Groove — follow the plan, see the line move. Offline-first gym tracker."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  dio: ^5.11.0
  drift: ^2.34.3
  # Bundles sqlite3_flutter_libs + path_provider and opens the database on a
  # background isolate — the app must never block the UI thread on SQLite
  # while a set is being logged.
  drift_flutter: ^0.3.1
  equatable: ^2.1.0
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^10.3.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^17.3.0
  intl: any
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.5
  # v7 ids: client-generated so offline row creation never waits on a server
  # sequence, and time-ordered so the primary-key index stays local (ADR §4.2).
  uuid: ^4.6.0
  share_plus: ^13.3.0
  file_picker: ^12.0.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  bloc_test: ^10.0.0
  drift_dev: ^2.34.0
  mocktail: ^1.0.5
  # Direct, because the migration test builds a v1 database from raw DDL
  # before drift is allowed anywhere near it.
  sqlite3: ^3.5.1

flutter:
  uses-material-design: true

  # ARB -> Dart runs as part of the normal build, so a new string is available
  # the moment it is added to `app_en.arb`. Config lives in `l10n.yaml`.
  generate: true

  # Outfit is the brand typeface. Bundled as assets rather than pulled with
  # google_fonts: a gym app has to render correctly offline and on first
  # launch, and a runtime font fetch means the first frame is in a fallback
  # face. It also ships `tnum`, which is what makes the tabular-figure rule in
  # ADR §13.3 possible — weight columns must not wobble as they update.
  # SIL OFL 1.1 — see assets/fonts/OFL.txt.
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-400.ttf
          weight: 400
        - asset: assets/fonts/Outfit-500.ttf
          weight: 500
        - asset: assets/fonts/Outfit-600.ttf
          weight: 600
        - asset: assets/fonts/Outfit-700.ttf
          weight: 700
        - asset: assets/fonts/Outfit-800.ttf
          weight: 800
